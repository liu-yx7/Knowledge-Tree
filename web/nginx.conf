server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    
    # gRPC-Web API proxy (for direct gRPC service calls via grpc-gateway)
    location ~ ^/memos\.api\.v1\..* {
        # Proxy to grpc-gateway backend (HTTP/JSON to gRPC translation)
        proxy_pass http://192.168.2.75:5230;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CRITICAL: Forward Origin header for cookie SameSite configuration
        proxy_set_header Origin $http_origin;
        
        # CRITICAL: Forward authentication headers for grpc-gateway
        # grpc-gateway looks for "grpcgateway-cookie" metadata
        proxy_set_header grpcgateway-cookie $http_cookie;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;

        # gRPC-Web specific headers
        proxy_set_header Content-Type $content_type;
        proxy_set_header Accept $http_accept;
        proxy_set_header X-Grpc-Web "1";
        proxy_set_header X-User-Agent $http_user_agent;

        # Timeouts for gRPC
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for streaming
        proxy_buffering off;
        proxy_request_buffering off;

        # Handle preflight requests for CORS
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, Cookie, X-Grpc-Web, X-User-Agent, grpc-timeout" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Length 0;
            return 204;
        }

        # For same-origin requests, no CORS headers needed
        # For cross-origin, backend handles CORS via grpc-gateway
    }
    
    location /api/ {
        proxy_pass http://192.168.2.75:5230;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CRITICAL: Forward Origin header for cookie SameSite configuration
        proxy_set_header Origin $http_origin;
        
        # Forward authentication
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Handle preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, Cookie, X-Requested-With" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Length 0;
            return 204;
        }
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

}
